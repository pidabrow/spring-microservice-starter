spring:
  application:
    name: sample-service
  datasource:
    url: jdbc:postgresql://localhost:5432/starter_db
    username: starter_user
    password: starter_pass
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

logging:
  level:
    com.pidabrow.starter: INFO
    org.springframework.web: INFO
