name: Bug
description: Report a defect. Structured input so a diagnosis can start from facts.
labels: [fix]
body:
  - type: markdown
    attributes:
      value: |
        Fields below become the input of `diagnosis.md`. The more deterministic
        the reproduction, the cheaper the regression test.
  - type: textarea
    id: symptom
    attributes:
      label: Symptom
      description: What happened, verbatim.
    validations:
      required: true
  - type: textarea
    id: stacktrace
    attributes:
      label: Stack trace or log excerpt
      render: text
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: [local, ci, staging, production]
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
